humanURL: https://www.virginaustralia.com/
description: >-
  Virgin Australia (IATA code VA, ASX:VGN) is Australia's second-largest airline group, founded in 2000
  and headquartered in Brisbane, operating a domestic and short-haul international network alongside
  charter and cargo services with more than 8,000 team members and the 13-million-member Velocity
  Frequent Flyer loyalty program. It sits on the airline side of a concentrated Australian duopoly with
  Qantas, and reaches travel agents and travel management companies almost entirely through
  GDS intermediation — Amadeus, Sabre and Travelport/Galileo — rather than through any direct
  machine interface of its own. Virgin Australia selected Sabre as its preferred NDC IT technology
  provider in October 2023 and renewed a multi-year Amadeus distribution agreement covering EDIFACT
  today and NDC in future, but as of July 2026 no Virgin Australia NDC endpoint, developer portal or
  API documentation is published anywhere on virginaustralia.com. Its API posture is honestly stated
  as none-published: developer.virginaustralia.com, developers., api., apis. and docs. subdomains do
  not resolve; /developers, /api, /api-docs, /openapi.json and /swagger.json all return 404; and the
  only partner surface is the Agency Hub, whose Travel Agent Main Agreement requires current IATA or
  ATIS accreditation, GDS access for BSP sales, and Virgin Australia's absolute discretion to approve
  an account. The one genuinely public programmatic-adjacent surface is the Virgin Australia app in
  ChatGPT, launched 10 June 2026 for flight and Velocity Reward Seat search only — it cannot book,
  amend, cancel or take payment, and its underlying interface is not documented.
