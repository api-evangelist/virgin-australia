  name: OpenAPI Specification
  conforms: false
  evidence: >-
    /openapi.json, /swagger.json, /v1/openapi.json, /api-docs and /docs return 404
    on www.virginaustralia.com and api.velocityfrequentflyer.com (probed 2026-07-28).
- id: asyncapi
