source: review.yml (2026-07-28 surface probe) + live discovery probes 2026-07-28
summary: >-
  Virgin Australia conforms to no published machine-readable API standard. The
  standards that genuinely govern its integrations are airline-industry
  distribution standards it CONSUMES through intermediaries (IATA EDIFACT via
  Amadeus, IATA BSP for settlement, IATA airline/airport/plating codes), not
  interface standards it PUBLISHES. IATA NDC is committed via an IT provider
  (Sabre, named preferred NDC IT technology provider 2023-10-31) but no Virgin
  Australia NDC endpoint, schema version or certification level is published, and
  a reseller (Duffel) confirms live access is via Travelport GDS. No OpenAPI,
  AsyncAPI, GraphQL, OAuth 2.0, OpenID Connect, RFC 9457 or RFC 9116 surface was
  found on any host. No compliance certification program (SOC 2, ISO 27001, PCI
  DSS) is published, so no Compliance pointer is wired.
standards:
