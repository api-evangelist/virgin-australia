- id: iata-ndc
  name: IATA New Distribution Capability
  conforms: false
  status: announced-via-it-provider-not-published
  evidence: >-
    Sabre press release 2023-10-31 — "Virgin Australia selects Sabre as its
    preferred NDC IT technology provider" to power its "future" NDC connection.
    No schema version stated, no certification level claimed, no endpoint
    published. Amadeus multi-year agreement covers content "through EDIFACT and,
    in the future, NDC channels." Duffel states it reaches Virgin Australia
    content "through Travelport, a global distribution system."
- id: iata-edifact
  name: IATA EDIFACT airline distribution messaging
  conforms: true
  role: consumed-via-intermediary
  evidence: >-
    Amadeus agreement gives advisors Virgin Australia schedules, fares, seat maps
    and ancillaries through EDIFACT channels. This is an interchange Virgin
    Australia participates in via the GDS, not a contract it publishes.
- id: iata-bsp
  name: IATA Billing and Settlement Plan
  conforms: true
  role: contractually-required
  evidence: >-
    Travel Agent Main Agreement Part E clause 2.a — "You must have GDS access for
    BSP Sales."
- id: iata-codes
  name: IATA/ICAO airline, airport and plating codes
  conforms: true
  role: industry-identifier
  evidence: >-
    IATA designator VA, ICAO designator VOZ, 3-digit plating code 795 (cited in
    the Payment Surcharge Policy as "Virgin Australia 795 ticket stock"), IATA
    3-letter airport codes and 6-character PNR record locators.
- id: opentravel
  name: OpenTravel Alliance / OTA schemas
