actions:
  apisListed: 0
  openapiHarvested: false
  specsCount: 0
  openapiDirectoryCreated: false
  gated: true
  portalConfirmed: false
  reason: |
    apis[] is deliberately EMPTY. Virgin Australia documents no API, so listing one
    would be fabrication. The ChatGPT app, the Velocity internal /api/* paths and
    api.velocityfrequentflyer.com were all considered and all rejected as apis[]
    entries: none has published documentation, a documented base URL, or a way for
    a third party to obtain access. They are recorded here in review.yml as
    observations with HTTP status, which is the honest place for them.
    No openapi/ directory was created because no specification exists to put in it.
