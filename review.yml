aid: virgin-australia
name: Virgin Australia
review:
  question: Does Virgin Australia publish a public developer portal, API documentation, or an NDC endpoint — and what would it cost a customer to leave?
  answer: false
  date: '2026-07-28'
  reviewer: API Evangelist
  scope: >-
    Bootstrap identity + honest public-API + spec harvest for the Australian
    travel & aviation seam. Consumer surface and distribution surface assessed
    separately and not conflated.
findings:
  summary: |
    Virgin Australia publishes NO developer portal, NO API reference, NO OpenAPI
    or other machine-readable contract, and NO NDC endpoint. Every candidate host
    and path was probed on 2026-07-28 and every one either failed DNS resolution
    or returned 404 (statuses recorded below). The only partner surface is the
    Agency Hub, a human-readable trade site whose "technical integration" is not
    an API at all — it is GDS connectivity. The Frequently Asked Questions for
    Travel Agents documents cryptic GDS entry formats (Amadeus, Galileo, Sabre)
    and a Virgin Australia account code, which is the actual integration contract.

    Two surfaces, kept distinct:

    CONSUMER SURFACE — no public API. Flight status, check-in, booking management
    and Velocity loyalty are delivered through virginaustralia.com, the Virgin
    Australia mobile app, and the Velocity Frequent Flyer app. velocityfrequentflyer.com
    /robots.txt explicitly disallows /api/* and /data/*, confirming an internal-only
    JSON surface with no published documentation. api.velocityfrequentflyer.com
    resolves but returns 404 at root with no documentation anywhere. The one
    genuinely public, genuinely novel surface is the Virgin Australia app in
    ChatGPT (launched 10 June 2026, an Australian airline first), which searches
    cash fares, Points + Pay and Velocity Reward Seats — and whose own terms state
    it does "not process payments; create, amend or cancel bookings; confirm final
    pricing, fare availability or fare conditions; or make binding commitments."
    Its underlying interface is not documented and is not offered to third parties.

    DISTRIBUTION SURFACE — GDS-intermediated, not NDC-direct. Virgin Australia
    selected Sabre as its preferred NDC IT technology provider on 31 October 2023
    ("to power its future New Distribution Capability connection") and extended a
    multi-year Amadeus agreement covering agency content "through EDIFACT and, in
    the future, NDC channels." Neither produced a published Virgin Australia NDC
    endpoint. Duffel — an aggregator that resells airline content — states plainly
    on its Virgin Australia page: "Currently, we access this airline's content
    through Travelport, a global distribution system designed for the travel
    industry." That is the definitive third-party confirmation: as of July 2026 a
    reseller reaching Virgin Australia reaches it through a GDS, not through NDC.
